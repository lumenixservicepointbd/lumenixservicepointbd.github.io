<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUMENIX Admin Panel</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">

</head>

<body>
<!-- =====================================
ADMIN H1 START
LUMENIX Admin Login Page
===================================== -->

<header class="main-header">

    <div class="brand-area">

        <h1>LUMENIX</h1>

        <p>V5.1 Premium Admin Panel</p>

    </div>

</header>

<section class="admin-login-section">

    <div class="admin-login-box">

        <h2>
            Administrator Login
        </h2>

        <p>
            MS FARDIN ELECTRIC<br>
            LUMENIX Ecosystem Control Panel
        </p>

        <input
            type="text"
            id="adminUsername"
            placeholder="Enter Username">

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password">

        <button id="adminLoginSystemBtn">
            Login
        </button>

    </div>

</section>

<script src="js/admin.js"></script>

</body>

</html>
