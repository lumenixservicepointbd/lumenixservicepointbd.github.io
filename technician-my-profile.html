<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Technician My Profile - LUMENIX Service Point</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:14px;
}

.card{
    background:#0d2035;
    border:1px solid #1f405e;
    border-radius:15px;
    padding:15px;
    margin-bottom:14px;
}

.header{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:9px;
    background:#fff;
    object-fit:contain;
    padding:4px;
}

.header h1{
    font-size:19px;
}

.header p{
    color:#8fa6bd;
    font-size:11px;
    margin-top:3px;
}

.back{
    display:block;
    width:100%;
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    background:#123452;
    border:1px solid #2b5274;
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-weight:700;
}

.profile-top{
    text-align:center;
    padding:10px 0 18px;
}

.profile-photo{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    background:#123452;
    border:3px solid #2389d4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    font-size:23px;
    margin-top:12px;
}

.tech-id{
    color:#63bcf5;
    font-size:12px;
    margin-top:5px;
}

.status{
    display:inline-block;
    margin-top:9px;
    padding:5px 10px;
    border-radius:15px;
    background:#123e2b;
    border:1px solid #267c58;
    color:#74e2af;
    font-size:11px;
    font-weight:700;
}

.section-title{
    font-size:16px;
    margin-bottom:11px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.info{
    background:#08182a;
    border:1px solid #284661;
    border-radius:9px;
    padding:10px;
}

.info-label{
    color:#829bb3;
    font-size:10px;
    margin-bottom:5px;
}

.info-value{
    color:#fff;
    font-size:13px;
    line-height:1.5;
    word-break:break-word;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.tag{
    background:#123b61;
    border:1px solid #23699e;
    color:#74c6ff;
    padding:6px 9px;
    border-radius:16px;
    font-size:11px;
    font-weight:700;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#08182a;
    border:1px solid #284661;
    border-radius:10px;
    padding:12px 6px;
    text-align:center;
}

.stat-number{
    font-size:22px;
    font-weight:800;
    color:#4eb6ff;
}

.stat-label{
    color:#829bb3;
    font-size:10px;
    margin-top:5px;
}

.payment{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}

.payment-box{
    background:#08182a;
    border:1px solid #284661;
    border-radius:9px;
    padding:10px;
}

.payment-title{
    color:#8da6bc;
    font-size:10px;
    margin-bottom:5px;
}

.payment-number{
    font-size:13px;
    font-weight:700;
}

.notice{
    background:#172d42;
    border-left:4px solid #2389d4;
    padding:11px;
    border-radius:7px;
    color:#b9ccdc;
    font-size:12px;
    line-height:1.6;
}

.danger{
    background:#351b20;
    border-left-color:#e05261;
    color:#eeb8be;
}

.loading,
.empty{
    text-align:center;
    color:#8299ae;
    padding:30px 10px;
}

.error{
    text-align:center;
    color:#ff9ca8;
    padding:30px 10px;
}

@media(max-width:600px){

    .info-grid{
        grid-template-columns:1fr;
    }

    .payment{
        grid-template-columns:1fr;
    }

}

@media(max-width:420px){

    .stats{
        grid-template-columns:1fr 1fr 1fr;
    }

    .stat-number{
        font-size:18px;
    }

    .profile-photo{
        width:105px;
        height:105px;
    }

}
</style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="header">

            <img
                class="logo"
                src="images/lumenix-service-logo-white.png"
                alt="LUMENIX"
            >

            <div>
                <h1>LUMENIX Service Point</h1>
                <p>Technician Profile</p>
            </div>

        </div>

        <a
            class="back"
            href="service-technician-profile.html"
        >
            ← টেকনিশিয়ান প্রোফাইলে ফিরে যান
        </a>

    </div>


    <div id="profileArea">

        <div class="card loading">
            প্রোফাইল লোড হচ্ছে...
        </div>

    </div>

</div>
    
<script src="js/lumenix-profile-bridge.js"></script>

  <script>
"use strict";

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const STORAGE_KEY =
            "lumenixServiceTechnicians";


        const profileArea =
            document.getElementById(
                "profileArea"
            );


        function escapeHTML(value){

            return String(
                value ?? ""
            )
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");

        }


        function getTechnicianId(){

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("id");

        }


        function getTechnicians(){

            try{

                return JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    )
                ) || [];

            }catch(error){

                return [];

            }

        }


        function formatDate(value){

            if(!value){
                return "তথ্য নেই";
            }

            try{

                return new Date(
                    value
                ).toLocaleDateString(
                    "bn-BD",
                    {
                        year:"numeric",
                        month:"long",
                        day:"numeric"
                    }
                );

            }catch(error){

                return value;

            }

        }


        function valueOrDash(value){

            return value
                ? escapeHTML(value)
                : "তথ্য নেই";

        }


        const technicianId =
            getTechnicianId();


        const technicians =
            getTechnicians();


        let technician = null;


        if(technicianId){

            technician =
                technicians.find(
                    function(item){

                        return String(
                            item.id
                        ) === String(
                            technicianId
                        );

                    }
                );

        }


        /*
         * ID না থাকলে সর্বশেষ
         * technician profile দেখাবে।
         */

        if(
            !technician &&
            technicians.length > 0
        ){

            technician =
                technicians[
                    technicians.length - 1
                ];

        }


        if(!technician){

            profileArea.innerHTML = `

                <div class="card">

                    <div class="error">

                        <h3>
                            টেকনিশিয়ান প্রোফাইল পাওয়া যায়নি
                        </h3>

                        <br>

                        <p>
                            আগে টেকনিশিয়ান প্রোফাইল তৈরি
                            করুন অথবা সঠিক Profile ID দিয়ে
                            এই পেজটি খুলুন।
                        </p>

                    </div>

                </div>

            `;

            return;

        }


        const photo =
            technician.photo
            ?
            `
            <img
                src="${technician.photo}"
                alt="Technician Photo"
            >
            `
            :
            "👨‍🔧";


        const categories =
            Array.isArray(
                technician.categories
            )
            ?
            technician.categories
            :
            [];


        const categoryHTML =
            categories.length
            ?
            categories
                .map(
                    function(category){

                        return `
                            <span class="tag">
                                ${escapeHTML(category)}
                            </span>
                        `;

                    }
                )
                .join("")
            :
            `<span class="tag">
                তথ্য নেই
            </span>`;


        const payment =
            technician.payment || {};


        const completed =
            Number(
                technician.completedServices || 0
            );


        const assigned =
            Number(
                technician.assignedServices || 0
            );


        const earnings =
            Number(
                technician.earnings || 0
            );


        profileArea.innerHTML = `

            <!-- PROFILE HEADER -->

            <div class="card">

                <div class="profile-top">

                    <div class="profile-photo">

                        ${photo}

                    </div>


                    <div class="name">

                        ${valueOrDash(
                            technician.technicianName
                        )}

                    </div>


                    <div class="tech-id">

                        Technician ID:
                        ${valueOrDash(
                            technician.technicianCode ||
                            technician.id
                        )}

                    </div>


                    <span class="status">

                        ${
                            technician.profileStatus ===
                            "Active"
                            ?
                            "✓ সক্রিয়"
                            :
                            "নিষ্ক্রিয়"
                        }

                    </span>

                </div>

            </div>



            <!-- BASIC INFORMATION -->

            <div class="card">

                <h3 class="section-title">
                    ব্যক্তিগত তথ্য
                </h3>


                <div class="info-grid">


                    <div class="info">

                        <div class="info-label">
                            নাম
                        </div>

                        <div class="info-value">
                            ${valueOrDash(
                                technician.technicianName
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            মোবাইল নম্বর
                        </div>

                        <div class="info-value">
                            ${valueOrDash(
                                technician.phone
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            জেলা / কাজের এলাকা
                        </div>

                        <div class="info-value">
                            ${valueOrDash(
                                technician.location
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            বর্তমান অবস্থা
                        </div>

                        <div class="info-value">
                            ${valueOrDash(
                                technician.status
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            প্রোফাইল তৈরি
                        </div>

                        <div class="info-value">
                            ${formatDate(
                                technician.createdAt
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-label">
                            শর্তাবলীতে সম্মতি
                        </div>

                        <div class="info-value">
                            ${
                                technician.termsAccepted
                                ?
                                "✓ সম্মতি দেওয়া হয়েছে"
                                :
                                "সম্মতি পাওয়া যায়নি"
                            }
                        </div>

                    </div>


                </div>

            </div>



            <!-- SERVICES -->

            <div class="card">

                <h3 class="section-title">
                    আমি যে কাজগুলো জানি
                </h3>


                <div class="tags">

                    ${categoryHTML}

                </div>

            </div>



            <!-- ACTIVITY -->

            <div class="card">

                <h3 class="section-title">
                    আমার কাজের হিসাব
                </h3>


                <div class="stats">


                    <div class="stat">

                        <div class="stat-number">
                            ${assigned}
                        </div>

                        <div class="stat-label">
                            মোট কাজ
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-number">
                            ${completed}
                        </div>

                        <div class="stat-label">
                            সম্পন্ন কাজ
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-number">
                            ৳${earnings}
                        </div>

                        <div class="stat-label">
                            মোট আয়
                        </div>

                    </div>


                </div>

            </div>



            <!-- PAYMENT -->

            <div class="card">

                <h3 class="section-title">
                    কোম্পানি থেকে পেমেন্ট পাওয়ার তথ্য
                </h3>


                <div class="payment">


                    <div class="payment-box">

                        <div class="payment-title">
                            বিকাশ
                        </div>

                        <div class="payment-number">
                            ${valueOrDash(
                                payment.bkash
                            )}
                        </div>

                    </div>


                    <div class="payment-box">

                        <div class="payment-title">
                            নগদ
                        </div>

                        <div class="payment-number">
                            ${valueOrDash(
                                payment.nagad
                            )}
                        </div>

                    </div>


                    <div class="payment-box">

                        <div class="payment-title">
                            রকেট
                        </div>

                        <div class="payment-number">
                            ${valueOrDash(
                                payment.rocket
                            )}
                        </div>

                    </div>


                </div>

            </div>



            <!-- ADDRESS -->

            <div class="card">

                <h3 class="section-title">
                    ঠিকানা
                </h3>

                <div class="notice">

                    ${valueOrDash(
                        technician.address
                    )}

                </div>

            </div>



            <!-- NOTES -->

            ${
                technician.notes
                ?
                `
                <div class="card">

                    <h3 class="section-title">
                        অতিরিক্ত তথ্য
                    </h3>

                    <div class="notice">

                        ${escapeHTML(
                            technician.notes
                        )}

                    </div>

                </div>
                `
                :
                ""
            }



            <!-- PUBLIC PROFILE NOTICE -->

            <div class="card">

                <div class="notice">

                    <strong>
                        কাস্টমারের জন্য প্রোফাইল পরিচিতি
                    </strong>

                    <br><br>

                    এই প্রোফাইলের মাধ্যমে কাস্টমার
                    টেকনিশিয়ানের নাম, ছবি, কাজের ধরন,
                    কাজের এলাকা এবং কাজের রেফারেন্স
                    দেখতে পারবেন।

                </div>

            </div>



            <!-- SECURITY NOTICE -->

            <div class="card">

                <div class="notice danger">

                    ⚠️ কোম্পানির অনুমতি ছাড়া কোনো
                    কাস্টমারের সঙ্গে ব্যক্তিগত কাজ বা
                    ব্যক্তিগত লেনদেন করা যাবে না।
                    কোম্পানির নিয়ম ভঙ্গের প্রমাণ
                    পাওয়া গেলে প্রোফাইল/আইডি
                    নিষ্ক্রিয় করা হতে পারে।

                </div>

            </div>

        `;

    }
);

</script>

</body>
</html>
